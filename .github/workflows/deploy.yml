name: CI/CD to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # CI: Validate core project files
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "Validating core files..."
          test -f index.html || (echo "index.html missing!" && exit 1)
          test -f style.css || (echo "style.css missing!" && exit 1)
          test -f script.js || (echo "script.js missing!" && exit 1)
          echo "All checks passed!"

  # CD: Trigger Render Deployment
  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets!"
            exit 1
          fi
          echo "Triggering deployment on Render..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment request sent successfully!"
